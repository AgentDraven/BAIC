name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    name: Lint, Type-check, Build, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Type-check and build
        run: bun run build

      - name: Run tests
        run: bun run test

  # Rust compile signal. Windows/Linux are this fork's release targets and must
  # pass. macOS is no longer a shipped target (served by upstream OpenUsage), so
  # its leg is best-effort: the cfg-gated NSPanel code is kept and still
  # compile-checked, but Apple-toolchain drift never blocks a Win/Linux release.
  rust-build:
    name: Tauri build (${{ matrix.platform }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            allow-failure: true
          - platform: windows-latest
            allow-failure: false
          - platform: ubuntu-latest
            allow-failure: false
    runs-on: ${{ matrix.platform }}
    continue-on-error: ${{ matrix.allow-failure }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Bundle plugins
        run: bun run bundle:plugins

      - name: Build frontend
        run: bun run build

      - name: Cargo build (src-tauri)
        working-directory: ./src-tauri
        run: cargo build --release
