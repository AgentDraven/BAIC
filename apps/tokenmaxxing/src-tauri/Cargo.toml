[package]
name = "openusage"
version = "0.7.14"
description = "Tokenmaxxing is an open source, cross-platform AI subscription limit tracker (a fork of OpenUsage)"
authors = ["Falk (falkoro/tokenmaxxing)", "Robin Ebers (original OpenUsage)"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "openusage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3.47", features = ["formatting"] }
dirs = "6"
log = "0.4"
libc = "0.2"
reqwest = { version = "0.13", features = ["blocking", "socks"] }
rquickjs = { version = "0.12", features = ["bindgen"] }
tauri-plugin-store = "2.4.3"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-log = "2"
tauri-plugin-aptabase = { git = "https://github.com/aptabase/tauri-plugin-aptabase", rev = "e896cceb" }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2.5.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
regex-lite = "0.1.9"
aes-gcm = "0.10.3"
sha2 = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
# Native NSPanel dropdown — macOS only. Other platforms use a borderless
# always-on-top WebviewWindow (see src/panel/other.rs).
# Pinned to an exact rev: the v2.1 branch head has breaking API changes and CI
# builds without --locked, so a moving branch ref re-resolves whenever
# Cargo.toml changes and breaks the macOS build.
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "da9c9a8d4eb7f0524a2508988df1a7d9585b4904" }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSProcessInfo", "NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSEvent", "NSScreen", "NSGraphics"] }
objc2-web-kit = { version = "0.3", features = ["WKPreferences", "WKWebView", "WKWebViewConfiguration"] }

[dev-dependencies]
serial_test = "3.5.0"

# Optimized release profile for the shipped Windows/Linux installers:
# fat LTO + single codegen unit + symbol strip + size-tuned opt level shrink the
# binary and speed up cold start. panic="abort" is deliberately NOT set — the
# plugin engine (rquickjs) relies on unwinding.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
